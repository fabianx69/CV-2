<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="CV profesional de Fabián Urrutia, Ingeniería en Informática y Analista Programador.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Fabián Urrutia | Ingeniería en Informática">
    <meta property="og:description" content="Desarrollo full stack, automatización, Power BI, IA generativa, cloud y soporte TI.">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://fabianx69.github.io/CV-profesional/">
    <!-- Parámetro ?v=5 para evitar problemas de caché en iPhone/Android -->
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="translations.js?v=5" defer></script>
    <script src="app.js?v=5" defer></script>
    <title>Fabián Urrutia | Ingeniería en Informática</title>
</head>
<body class="cv-layout">

    <!-- SELECTOR DE IDIOMAS (Arriba en PC / Columna izquierda 'espalda de la E' en Móvil) -->
    <nav class="language-nav" aria-label="Selector de idioma">
        <div class="language-nav__inner">
            <button type="button" class="lang-button is-active" data-lang="es" aria-pressed="true">ESP</button>
            <button type="button" class="lang-button" data-lang="en" aria-pressed="false">ENG</button>
            <button type="button" class="lang-button" data-lang="fr" aria-pressed="false">FRA</button>
            <button type="button" class="lang-button" data-lang="de" aria-pressed="false">DEU</button>
            <button type="button" class="lang-button" data-lang="it" aria-pressed="false">ITA</button>
            <span class="language-nav__separator" aria-hidden="true">|</span>
            <button type="button" class="lang-button" data-lang="zh" aria-pressed="false">中文</button>
            <button type="button" class="lang-button" data-lang="ko" aria-pressed="false">한국어</button>
            <button type="button" class="lang-button" data-lang="ja" aria-pressed="false">日本語</button>
            <button type="button" class="lang-button" data-lang="hi" aria-pressed="false">हिन्दी</button>
        </div>
    </nav>

    <!-- CUERPO PRINCIPAL (En móvil son los 3 brazos de la letra E) -->
    <main id="main-container" class="resume-card">
        
        <!-- BRAZO 1 DE LA 'E' (Superior en móvil / Columna izquierda superior en PC) -->
        <section class="arm-top">
            <header class="resume-header">
                <h1>FABIÁN ENRIQUE URRUTIA PALMA</h1>
                <p id="title-tag" class="role-badge"></p>
                <address class="contact-list">
                    <span>Santiago, Chile</span>
                    <span class="sep-dot">•</span>
                    <a href="mailto:fabianenriqueurrutiap@gmail.com">fabianenriqueurrutiap@gmail.com</a>
                    <span class="sep-dot">•</span>
                    <a href="tel:+56992200739">+56 9 9220 0739</a>
                    <span class="sep-dot">•</span>
                    <a href="https://fabianx69.github.io/CV-profesional/">Portafolio web</a>
                </address>
            </header>

            <div class="profile-block">
                <h2 class="section-title" id="lbl-profile"></h2>
                <p id="val-profile" class="profile-text"></p>
            </div>

            <div class="edu-lang-block">
                <div class="edu-sub">
                    <h2 class="section-title" id="lbl-edu"></h2>
                    <div id="val-edu" class="education-content"></div>
                </div>
                <div class="lang-sub">
                    <h2 class="section-title" id="lbl-langs"></h2>
                    <div id="val-langs" class="languages-grid"></div>
                </div>
            </div>
        </section>

        <!-- BRAZO 2 DE LA 'E' (Medio en móvil / Columna derecha en PC) -->
        <section class="arm-middle">
            <div class="exp-block">
                <h2 class="section-title" id="lbl-exp"></h2>
                <div id="val-exp" class="experience-content"></div>
            </div>

            <div class="projs-block">
                <h2 class="section-title" id="lbl-projs"></h2>
                <div id="val-projs" class="projects-list"></div>
            </div>
        </section>

        <!-- BRAZO 3 DE LA 'E' (Inferior en móvil y PC) -->
        <footer class="arm-bottom">
            <div class="skills-block">
                <h2 class="section-title" id="lbl-skills"></h2>
                <div id="val-skills" class="skills-grid"></div>
            </div>

            <div class="certs-block">
                <div class="certs-header-row">
                    <h2 class="section-title" id="lbl-certs"></h2>
                    <a id="certs-link"
                       class="primary-link"
                       href="https://drive.google.com/drive/folders/1aTAoiuF45wiqF9LQGXATr0hYDVl1PITS?usp=sharing"
                       target="_blank"
                       rel="noopener noreferrer">
                        <span id="lbl-certs-link"></span>
                        <span aria-hidden="true">↗</span>
                    </a>
                </div>
                <div id="val-certs" class="certifications-list"></div>
            </div>
        </footer>
    </main>
</body>
</html>
